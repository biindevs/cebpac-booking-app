services:
  - type: web
    name: cebpac-booking
    env: php
    plan: free
    buildCommand: |
      mkdir -p /opt/render/project/uploads
      chmod 755 /opt/render/project/uploads
    startCommand: "php -S 0.0.0.0:$PORT -t public"
    envVars:
      - key: DATABASE_HOST
        value: $DATABASE_HOST
      - key: DATABASE_USER
        value: $DATABASE_USER
      - key: DATABASE_PASS
        value: $DATABASE_PASS
        isSecret: true
      - key: DATABASE_NAME
        value: $DATABASE_NAME
      - key: APP_ENV
        value: production

  - type: pserv
    name: cebpac-db
    plan: free
    ipAllowList: []
